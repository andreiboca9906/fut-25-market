    "PLW0602",
    "RET507",
    "PIE804",
    "PYI036",
    "B008",
    "FLY002",
    "PT003",
    "PT015",
    "PT027",
    "EXE002",
    "PIE800",
    "RET508",
    "PT008",
    "PIE810",
    "PLE1205",
    "PYI041",
    "RET502",
    "RUF006",
    "PD002",
    "PLC0208",
    "PT017",
    "PYI024",
    "PD901",
    "PLW0120",
    "PLW0127",
    "N804",
    "PT019",
    "N801",
    "S307",
    "PT014",
    "SLOT000",
    "N817",
    "N816",
    "T203",
    "N811",
    "PYI016",
    "RUF013",
    "PIE796",
    "PT013",
    "PYI013",
    "PYI034",
    "RUF009",
    "B004",
    "ICN001",
    "PYI032",
    "PT021",
    "N813",
    "PD008",
    "PIE807",
    "PYI030",
    "G010",
    "PLC0105",
    "PLW0129",
    "PLW3301",
    "B026",
    "B027",
    "DJ006",
    "DJ007",
    "PYI055",
    "N807",
    "PD003",
    "PLE0302",
    "RUF007",
    "B035",
    "RUF016",
]

[dependency-groups]
dev = [
    "ruff>=0.12.7",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
